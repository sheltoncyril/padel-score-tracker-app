name: Bajada
options:
  bundleIdPrefix: com.sheltoncyril
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  generateEmptyDirectories: true

# Base.xcconfig includes the optional, gitignored Local.xcconfig
# (DEVELOPMENT_TEAM and the NO_HEALTHKIT switches). CI builds without it.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

packages:
  PadelKit:
    path: Packages/PadelKit

targets:
  Bajada:
    type: application
    platform: iOS
    sources:
      - PhoneApp
    dependencies:
      - package: PadelKit
      - target: BajadaWatch
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sheltoncyril.bajada
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bajada
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight

  BajadaWatch:
    type: application
    platform: watchOS
    sources:
      - path: WatchApp
        excludes:
          - "*.plist"
          - "*.entitlements"
    dependencies:
      - package: PadelKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sheltoncyril.bajada.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: $(BAJADA_WATCH_INFOPLIST)
        INFOPLIST_KEY_CFBundleDisplayName: Bajada
        CODE_SIGN_ENTITLEMENTS: $(BAJADA_WATCH_ENTITLEMENTS)
        OTHER_SWIFT_FLAGS: $(inherited) $(BAJADA_SWIFT_FLAGS)

schemes:
  Bajada:
    build:
      targets:
        Bajada: all
    run:
      config: Debug
    archive:
      config: Release
  BajadaWatch:
    build:
      targets:
        BajadaWatch: all
    run:
      config: Debug
    archive:
      config: Release
